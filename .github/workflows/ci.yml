name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The package has no dependencies and imports nothing outside node:
        # builtins. 22.15 is the declared floor in engines; 24 is where
        # --test-isolation exists, which the sandbox note in the README relies
        # on. Plain `node --test` works on both.
        node-version: ['22.15', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit tests
        run: node --test test/*.test.mjs

      - name: Client half parses
        run: node --check lib/client.js
